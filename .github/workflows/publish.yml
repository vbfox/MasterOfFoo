name: Publish

on:
  push:
    tags: ['*.*.*']

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # Required for NuGet Trusted Publishing (OIDC)
      contents: write # Required to create the GitHub Release
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      PAKET_SKIP_RESTORE_TARGETS: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          2
          5
          8.0.x
          10.0.x
    - name: Restore packages
      run: ./paket.sh restore
    - name: Compile build script
      run: dotnet build src/BlackFox.MasterOfFoo.Build/BlackFox.MasterOfFoo.Build.fsproj
    - name: NuGet login (OIDC -> short-lived API key)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ vars.NUGET_USER }}
    - name: Build, test, pack, publish
      env:
        nuget-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./build.sh CIPublishRelease
